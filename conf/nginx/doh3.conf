# =================================================
# Nginx HTTP/3 (DoH3) 反向代理配置
# 适用于 Nginx 1.25.0+，需编译时启用 QUIC/HTTP3 模块
# 将对外 443 端口的 DoH/DoH3 请求反代到 dnsproxy 的 813 端口
# =================================================

server {
    # HTTP/3 (QUIC over UDP)
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    # HTTP/2 回退 (TCP)
    listen 443 ssl;
    listen [::]:443 ssl;

    http2 on;
    server_name dns.example.com;

    # TLS 证书
    ssl_certificate     /ssl/cert.pem;
    ssl_certificate_key /ssl/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 通告客户端支持 HTTP/3
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    add_header X-Quic  'h3' always;

    # 正则匹配 DoH 查询路径 (dns-query / resolve 等常见端点)
    location ~ ^/(dns-query|resolve)$ {
        proxy_pass http://127.0.0.1:813;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # DoH 使用 POST/GET 传递 DNS 报文，透传 body
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
