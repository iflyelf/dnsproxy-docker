---
# DoH、DoT、DoQ、DoH3 的 Bootstrap DNS
bootstrap:
  - "tcp://127.0.0.1:53"
  - "127.0.0.1:53"
# 监听地址
listen-addrs:
  - "0.0.0.0"
# UDP 监听端口 (标准 DNS 端口)
listen-ports:
  - 53
# DNS-over-TLS (DoT) 监听端口
tls-port:
  - 853
# DNS-over-HTTPS (DoH) 监听端口 (标准端口 443)
https-port:
  - 443
# DNS-over-QUIC (DoQ) 监听端口 (标准端口 UDP 853)
quic-port:
  - 853
# 启用 HTTP/3 支持 (DoH3 使用 UDP 443，与 DoH 共用端口号)
http3: true
# 证书公钥
tls-crt: ''
# 证书私钥
tls-key: ''
# 设置GO最大线程
max-go-routines: 655350
# 速率限制
ratelimit: 0
# IPv4 的速率限制子网长度
ratelimit-subnet-len-ipv4: 24
# IPv6 的速率限制子网长度
ratelimit-subnet-len-ipv6: 64
# 设置 UDP 缓冲区的大小
udp-buf-size: 0
# 上游DNS
upstream:
  - "tcp://127.0.0.1:53"
  - "127.0.0.1:53"
# 超时时间
timeout: '30s'
